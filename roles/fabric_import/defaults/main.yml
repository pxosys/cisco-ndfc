---
ndfc_platform_version: "nd4.3"
dest_fabric_name: "Fabric-New-02"
dest_fabric_template: "Easy_Fabric"
backup_base_dir: "{{ playbook_dir }}/../backups/{{ ndfc_platform_version }}/{{ source_fabric_name }}"
switch_serial_map: {}

ndfc_api_prefix_map:
  nd4.3: "/appcenter/cisco/ndfc/api/v1/lan-fabric"
  ndfc12: "/appcenter/cisco/ndfc/api/v1/lan-fabric"
  dcnm11: ""

ndfc_api_prefix: "{{ ndfc_api_prefix_map[ndfc_platform_version] | default('/appcenter/cisco/ndfc/api/v1/lan-fabric') }}"

# Read-only keys stripped prior to POSTing objects to a new fabric
fabric_import_vrf_strip_keys:
  - id
  - vrfStatus
  - createdOn
  - modifiedOn

fabric_import_network_strip_keys:
  - id
  - networkStatus
  - createdOn
  - modifiedOn

fabric_import_policy_strip_keys:
  - id
  - policyId
  - createdOn
  - modifiedOn
  - status
  - autoGenerated
