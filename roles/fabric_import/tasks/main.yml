---
- name: Load exported JSON artifacts from local backup directory
  ansible.builtin.set_fact:
    fabric_import_src_fabric: "{{ lookup('file', backup_base_dir + '/fabric_settings.json') | from_json }}"
    fabric_import_src_vrfs: "{{ lookup('file', backup_base_dir + '/vrfs.json') | from_json }}"
    fabric_import_src_networks: "{{ lookup('file', backup_base_dir + '/networks.json') | from_json }}"
    fabric_import_src_policies: "{{ lookup('file', backup_base_dir + '/policies.json') | from_json }}"

- name: Check whether destination fabric already exists
  cisco.dcnm.dcnm_rest:
    method: GET
    path: "{{ ndfc_api_prefix }}/rest/control/fabrics/{{ dest_fabric_name }}"
  register: fabric_import_dest_check
  failed_when: false

- name: Create destination fabric with source nvPairs
  cisco.dcnm.dcnm_rest:
    method: POST
    path: "{{ ndfc_api_prefix }}/rest/control/fabrics/{{ dest_fabric_name }}/{{ dest_fabric_template }}"
    json_data: "{{ fabric_import_src_fabric.nvPairs | combine({'FABRIC_NAME': dest_fabric_name}) }}"
  when: fabric_import_dest_check.response.RETURN_CODE | default(404) != 200

- name: Recreate VRFs in destination fabric
  cisco.dcnm.dcnm_rest:
    method: POST
    path: "{{ ndfc_api_prefix }}/rest/top-down/fabrics/{{ dest_fabric_name }}/vrfs"
    json_data: >-
      {{
        item
        | combine({'fabric': dest_fabric_name})
        | dict2items
        | rejectattr('key', 'in', fabric_import_vrf_strip_keys)
        | items2dict
      }}
  loop: "{{ fabric_import_src_vrfs }}"
  loop_control:
    label: "{{ item.vrfName }}"
  when: fabric_import_src_vrfs | length > 0

- name: Recreate networks in destination fabric
  cisco.dcnm.dcnm_rest:
    method: POST
    path: "{{ ndfc_api_prefix }}/rest/top-down/fabrics/{{ dest_fabric_name }}/networks"
    json_data: >-
      {{
        item
        | combine({'fabric': dest_fabric_name})
        | dict2items
        | rejectattr('key', 'in', fabric_import_network_strip_keys)
        | items2dict
      }}
  loop: "{{ fabric_import_src_networks }}"
  loop_control:
    label: "{{ item.networkName }}"
  when: fabric_import_src_networks | length > 0

- name: Recreate fabric-level configuration policies
  cisco.dcnm.dcnm_rest:
    method: POST
    path: "{{ ndfc_api_prefix }}/rest/control/policies"
    json_data: >-
      {{
        item
        | combine({'fabricName': dest_fabric_name})
        | dict2items
        | rejectattr('key', 'in', fabric_import_policy_strip_keys)
        | items2dict
      }}
  loop: "{{ fabric_import_src_policies }}"
  loop_control:
    label: "{{ item.templateName }} (Priority: {{ item.priority | default(500) }})"
  when:
    - fabric_import_src_policies | length > 0
    - item.serialNumber is not defined or item.serialNumber == ""
    - not (item.autoGenerated | default(false))

- name: Recreate mapped switch-level configuration policies
  cisco.dcnm.dcnm_rest:
    method: POST
    path: "{{ ndfc_api_prefix }}/rest/control/policies"
    json_data: >-
      {{
        item
        | combine({
            'fabricName': dest_fabric_name,
            'serialNumber': switch_serial_map[item.serialNumber]
          })
        | dict2items
        | rejectattr('key', 'in', fabric_import_policy_strip_keys)
        | items2dict
      }}
  loop: "{{ fabric_import_src_policies }}"
  loop_control:
    label: "{{ item.templateName }} ({{ item.serialNumber }} -> {{ switch_serial_map[item.serialNumber] | default('unmapped') }})"
  when:
    - fabric_import_src_policies | length > 0
    - item.serialNumber is defined
    - item.serialNumber in switch_serial_map
    - not (item.autoGenerated | default(false))
